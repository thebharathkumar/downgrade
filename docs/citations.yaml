# Every external figure quoted anywhere in this repo, with a verification flag.
#
# Nothing with `verified: false` may appear in the README, the CLI output, or
# any published report. tests/test_citations.py enforces that: it fails if an
# unverified figure's value appears in a published artifact.
#
# arxiv.org is unreachable from the development container this repo was built
# in, so these figures could not be checked against the abstract at authoring
# time. Verify against the paper before publishing.

