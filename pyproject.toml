[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "downgrade"
version = "0.1.0"
description = "Measure silent quality regression when a model router downgrades your requests."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Bharath kumar R"}]
keywords = [
    "llm",
    "model-routing",
    "observability",
    "opentelemetry",
    "benchmark",
    "agents",
    "evaluation",
    "fireworks",
    "quality-regression",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "click>=8.1,<9",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/thebharathkumar/downgrade"
Repository = "https://github.com/thebharathkumar/downgrade"
Issues = "https://github.com/thebharathkumar/downgrade/issues"

[project.scripts]
downgrade = "downgrade.cli:main"

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.25,<2",
    "opentelemetry-sdk>=1.25,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.25,<2",
]
judge = ["anthropic>=0.40,<2"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML",
    "respx>=0.21",
    "opentelemetry-api>=1.25,<2",
    "opentelemetry-sdk>=1.25,<2",
    "anthropic>=0.40,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/downgrade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["src/downgrade"]
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/downgrade"]
plugins = ["pydantic.mypy"]
